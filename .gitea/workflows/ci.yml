# Gitea Actions CI for PVEHub-MCP.
#
# Runner requirements: a Linux runner labelled `ubuntu-latest` with network
# access (uv downloads its managed CPython 3.12 if the image has no 3.12) and,
# for the docker job, a reachable Docker daemon. The docker job skips itself
# when no daemon is available instead of failing the pipeline silently.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: mypy
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Docker availability
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::No Docker daemon on this runner; skipping image build"
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build image
        if: steps.docker.outputs.available == 'true'
        run: docker build --pull -t pvehub-mcp:ci .

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Docker availability
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::No Docker daemon on this runner; skipping compose smoke"
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Prepare compose environment
        if: steps.docker.outputs.available == 'true'
        run: |
          cp .env.example .env
          sed -i 's/^PVEHUB_MCP_AUTH_TOKEN=.*/PVEHUB_MCP_AUTH_TOKEN=ci-smoke-token-0123456789/' .env
          sed -i 's#^PVEHUB_PVE_URL=.*#PVEHUB_PVE_URL=https://127.0.0.1:8006#' .env
          sed -i 's#^PVEHUB_PBS_URL=.*#PVEHUB_PBS_URL=https://127.0.0.1:8007#' .env
          mkdir -p config ssh
          cp config/examples/readonly.yaml config/policy.yaml
      - name: Compose config
        if: steps.docker.outputs.available == 'true'
        run: docker compose config >/dev/null
      - name: Compose smoke
        if: steps.docker.outputs.available == 'true'
        run: |
          # Pass the bearer explicitly to the exec'd probe so the smoke does
          # not depend on the container's runtime environment.
          token=$(sed -n 's/^PVEHUB_MCP_AUTH_TOKEN=//p' .env)
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            # Readiness probe with the bearer: 200 = healthy, 503 = up but
            # degraded — in CI the PVE/PBS URLs are unreachable placeholders,
            # so 503 is the expected steady state here and still proves the
            # app answers. Liveness (/health) and auth (401 without bearer)
            # are asserted as well. The python block must start at column 0
            # of the script (shell-quoted multi-line python).
            if docker compose exec -T -e PVEHUB_MCP_AUTH_TOKEN="$token" pvehub-mcp python -c "
          import os,sys,urllib.request as u,urllib.error
          t=os.environ.get('PVEHUB_MCP_AUTH_TOKEN','')
          h={'Authorization':'Bearer '+t} if t else {}
          def status(path,headers):
              try:
                  return u.urlopen(u.Request(path,headers=headers),timeout=4).status
              except u.HTTPError as e:
                  return e.code
          assert status('http://127.0.0.1:8080/health',{})==200
          assert status('http://127.0.0.1:8080/ready',h) in (200,503)
          assert status('http://127.0.0.1:8080/ready',{})==401
            "; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop compose
        if: always() && steps.docker.outputs.available == 'true'
        run: docker compose down -v || true
