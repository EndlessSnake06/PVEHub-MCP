# Gitea Actions CI for PVEHub-MCP.
#
# Runner requirements: a Linux runner labelled `ubuntu-latest` with network
# access (uv downloads its managed CPython 3.12 if the image has no 3.12) and,
# for the docker job, a reachable Docker daemon. The docker job skips itself
# when no daemon is available instead of failing the pipeline silently.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: mypy
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: pytest
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Docker availability
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::No Docker daemon on this runner; skipping image build"
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build image
        if: steps.docker.outputs.available == 'true'
        run: docker build --pull -t pvehub-mcp:ci .
